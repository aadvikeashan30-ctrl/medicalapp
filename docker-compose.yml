services:
  mongo:
    image: ghcr.io/ferretdb/ferretdb:1
    container_name: docclinic-ferretdb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - FERRETDB_POSTGRESQL_URL=postgresql://neondb_owner:npg_fqJwFyueI1x8@ep-sparkling-resonance-ap5f5lec-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

  backend:
    build:
      context: ./backend
    container_name: docclinic-api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://neondb_owner:npg_fqJwFyueI1x8@mongo:27017/neondb?authMechanism=PLAIN
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRY: ${JWT_EXPIRY:-30d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-whatsapp:+14155238886}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"

volumes:
  backend_uploads:
